name: NLP coherence runtime

on:
  push:
    branches: ["main", "codex/**", "agent/**"]
    paths: ["nlp_coherence_runtime/**", ".github/workflows/nlp-coherence-runtime-ci.yml"]
  pull_request:
    paths: ["nlp_coherence_runtime/**", ".github/workflows/nlp-coherence-runtime-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - working-directory: nlp_coherence_runtime
        run: |
          cmp .github/workflows/nlp-coherence-runtime-ci.yml ../.github/workflows/nlp-coherence-runtime-ci.yml
          sha512sum -c SHA512SUMS
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --require-hashes --only-binary=:all: -r build-requirements-lock.txt
          python -m zoran_nlp_coherence.proof --verify-seal-only
          python -m unittest discover -s tests -v
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir /tmp/zoran-wheel

  proof-sha512:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - working-directory: nlp_coherence_runtime
        run: |
          cmp .github/workflows/nlp-coherence-runtime-ci.yml ../.github/workflows/nlp-coherence-runtime-ci.yml
          sha512sum -c SHA512SUMS
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m zoran_nlp_coherence.proof --verify-seal-only
          python -m zoran_nlp_coherence.proof
